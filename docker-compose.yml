services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: localify
      POSTGRES_PASSWORD: localify
      POSTGRES_DB: localify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localify -d localify"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8008:8000"
    environment:
      DATABASE_URL: postgres://localify:localify@db:5432/localify
      MEDIA_DIR: /data/media
      PUBLIC_BASE_URL: http://localhost:8008
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:-dev-change-me-use-openssl-rand-hex-32}
      SIGNED_URL_TTL_SECONDS: "3600"
      MAX_CONCURRENT_DOWNLOADS: "2"
      LOG_LEVEL: INFO
      # YouTube: do NOT put huge YTDLP_COOKIES_B64 in a repo `.env` — `docker compose build` can fail with
      # "argument list too long" (BuildKit inherits the env). Use a mounted file locally (see volume below).
      # On Render, set YTDLP_COOKIES_B64 only in the dashboard (runtime), not in files used at image build.
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
    volumes:
      - mediadata:/data/media
      # If YTDLP_COOKIES_FILE is set (e.g. /secrets/youtube-cookies.txt), mount your Netscape cookies file:
      # - ./youtube-cookies.txt:/secrets/youtube-cookies.txt:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  mediadata:
